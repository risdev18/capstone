<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="irGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="110" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

  <!-- PCB Board -->
  <rect x="70" y="45" width="260" height="210" rx="20" fill="url(#pcbGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Mounting Holes with Copper Rings -->
  <circle cx="95" cy="70" r="10" fill="#0f172a" stroke="#d97706" stroke-width="2" />
  <circle cx="305" cy="70" r="10" fill="#0f172a" stroke="#d97706" stroke-width="2" />
  <circle cx="95" cy="230" r="10" fill="#0f172a" stroke="#d97706" stroke-width="2" />
  <circle cx="305" cy="230" r="10" fill="#0f172a" stroke="#d97706" stroke-width="2" />

  <!-- PCB Copper Traces -->
  <path d="M 95 110 L 130 110 L 150 130" stroke="#059669" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 305 110 L 270 110 L 250 130" stroke="#059669" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 130 190 L 150 170" stroke="#059669" stroke-width="2" fill="none" opacity="0.6" />

  <!-- MAX30102 Main IC Optical Sensor Module -->
  <rect x="140" y="95" width="120" height="110" rx="12" fill="url(#chipGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Optical Glass Window -->
  <rect x="160" y="115" width="80" height="45" rx="6" fill="#000000" stroke="#475569" stroke-width="1.5" />
  
  <!-- Red LED Emitter -->
  <circle cx="180" cy="137" r="9" fill="#ef4444" filter="url(#glow)" />
  <circle cx="180" cy="137" r="4" fill="#ffffff" />
  
  <!-- IR LED Emitter / Photodetector -->
  <rect x="208" y="128" width="18" height="18" rx="3" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
  <circle cx="217" cy="137" r="5" fill="#f87171" opacity="0.7" />

  <!-- Chip Text -->
  <text x="200" y="185" font-family="monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">MAX30102</text>
  <text x="200" y="198" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">HR &amp; SpO2 SENSOR</text>

  <!-- Pulse Waveform Overlay -->
  <path d="M 70 215 L 120 215 L 135 195 L 145 235 L 160 175 L 175 245 L 185 205 L 200 215 L 330 215" 
        stroke="url(#pulseGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Pin Header at Bottom -->
  <g transform="translate(115, 235)">
    <rect x="0" y="0" width="170" height="18" rx="3" fill="#1e293b" />
    <circle cx="15" cy="9" r="3.5" fill="#f59e0b" />
    <circle cx="45" cy="9" r="3.5" fill="#f59e0b" />
    <circle cx="75" cy="9" r="3.5" fill="#f59e0b" />
    <circle cx="105" cy="9" r="3.5" fill="#f59e0b" />
    <circle cx="135" cy="9" r="3.5" fill="#f59e0b" />
    <circle cx="155" cy="9" r="3.5" fill="#f59e0b" />
  </g>
</svg>
