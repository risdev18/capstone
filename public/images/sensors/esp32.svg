<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="espPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wifiPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="espGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="110" fill="#3b82f6" opacity="0.12" filter="url(#espGlow)" />

  <!-- ESP32 PCB Module -->
  <rect x="90" y="35" width="220" height="230" rx="14" fill="url(#espPcb)" stroke="#334155" stroke-width="2" />

  <!-- PCB Antenna Area (Top Meander) -->
  <rect x="130" y="45" width="140" height="40" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="1.5" />
  <!-- Inverted F Meander Antenna Pattern -->
  <path d="M 145 65 L 160 65 L 160 52 L 180 52 L 180 65 L 200 65 L 200 52 L 220 52 L 220 65 L 245 65" 
        stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linejoin="round" />

  <!-- Metal RF Shield Can -->
  <rect x="120" y="105" width="160" height="115" rx="8" fill="url(#canGrad)" stroke="#64748b" stroke-width="1.5" />

  <!-- Engraved Text on Shield -->
  <text x="200" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">ESP-WROOM-32</text>
  <text x="200" y="152" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">DUAL CORE 240MHz · 2.4GHz</text>

  <!-- Wi-Fi & Bluetooth Icons / Waves -->
  <g transform="translate(180, 165)">
    <path d="M 0 10 A 15 15 0 0 1 40 10" stroke="url(#wifiPulse)" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 7 15 A 10 10 0 0 1 33 15" stroke="url(#wifiPulse)" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="20" cy="20" r="3" fill="#06b6d4" />
  </g>

  <!-- Status LEDs -->
  <circle cx="115" cy="240" r="4" fill="#ef4444" filter="url(#espGlow)" />
  <circle cx="130" cy="240" r="4" fill="#3b82f6" filter="url(#espGlow)" />
  <circle cx="145" cy="240" r="4" fill="#10b981" filter="url(#espGlow)" />

  <!-- Side Pin Headers -->
  <g fill="#f59e0b">
    <rect x="75" y="55" width="10" height="6" rx="1" />
    <rect x="75" y="70" width="10" height="6" rx="1" />
    <rect x="75" y="85" width="10" height="6" rx="1" />
    <rect x="75" y="100" width="10" height="6" rx="1" />
    <rect x="75" y="115" width="10" height="6" rx="1" />
    <rect x="75" y="130" width="10" height="6" rx="1" />
    <rect x="75" y="145" width="10" height="6" rx="1" />
    <rect x="75" y="160" width="10" height="6" rx="1" />
    <rect x="75" y="175" width="10" height="6" rx="1" />
    <rect x="75" y="190" width="10" height="6" rx="1" />
    <rect x="75" y="205" width="10" height="6" rx="1" />
    <rect x="75" y="220" width="10" height="6" rx="1" />

    <rect x="315" y="55" width="10" height="6" rx="1" />
    <rect x="315" y="70" width="10" height="6" rx="1" />
    <rect x="315" y="85" width="10" height="6" rx="1" />
    <rect x="315" y="100" width="10" height="6" rx="1" />
    <rect x="315" y="115" width="10" height="6" rx="1" />
    <rect x="315" y="130" width="10" height="6" rx="1" />
    <rect x="315" y="145" width="10" height="6" rx="1" />
    <rect x="315" y="160" width="10" height="6" rx="1" />
    <rect x="315" y="175" width="10" height="6" rx="1" />
    <rect x="315" y="190" width="10" height="6" rx="1" />
    <rect x="315" y="205" width="10" height="6" rx="1" />
    <rect x="315" y="220" width="10" height="6" rx="1" />
  </g>
</svg>
